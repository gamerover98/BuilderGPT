# Both of these moved at 1.0.0, and both have a cost that is paid once.
#
# `appId` is install identity: an installed copy carrying the old
# `ai.cynia.buildergpt` is not upgraded by an installer carrying this one, it is
# installed beside it. And `package.json`'s `name` is what `app.getName()`
# resolves to, which is what Electron calls the userData directory — so an
# existing install's settings, encrypted API keys, conversations, checkpoints
# and version history are all still under the old directory and are not read.
#
# That was worth doing before there was an audience and would not be after.
# Nothing migrates them: see the note in `services/resources.ts`.
appId: it.gamerover98.schematicaistudio
productName: Schematic AI Studio
copyright: Copyright © CyniaAI Team

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# prompts.json and block_id_list.txt stay outside the asar so users can edit
# them, and so `services/resources.ts`'s `process.resourcesPath` lookup finds
# them (see ARCHITECTURE.md §2 / resources.ts).
extraResources:
  - from: prompts.json
    to: prompts.json
  - from: block_id_list.txt
    to: block_id_list.txt
  # The default preview resource pack, plus `legacy_blocks.json` (the pre-1.13
  # id -> block-state table used to read MCEdit .schematic files).
  # `defaultResourcePackPath` scans this directory for the first .zip, so the
  # pack can be swapped or updated without touching code.
  - from: resources
    to: resources
  # The window icon, for `services/resources.ts`'s `appIconPath()`.
  #
  # `build/` is electron-builder's *buildResources* directory and is not in
  # `files`, so nothing under it exists at runtime -- the .ico embedded in the
  # .exe and the .icns in the .app are generated from `build/icon.png` at
  # package time and are not the same thing as a file the app can read. This
  # entry is what puts the window icon on Linux, where the running process has
  # to supply its own.
  - from: build/icon.png
    to: icon.png

# No asarUnpack list, and no native rebuild step: the sandbox is QuickJS
# compiled to WebAssembly, shipped by the "singlefile" variant that embeds the
# .wasm inside its JS module (RULEBOOK.md DEV-015). Every dependency left in
# this app is pure JS, so the same asar works on all three platforms.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: SchematicAIStudio-${version}-setup-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Graphics
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: SchematicAIStudio-${version}-${arch}.${ext}

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: SchematicAIStudio-${version}-${arch}.${ext}
