# Both of these moved at 1.0.0, and both have a cost that is paid once.
#
# `appId` is install identity: an installed copy carrying the old
# `ai.cynia.buildergpt` is not upgraded by an installer carrying this one, it is
# installed beside it. And `package.json`'s `name` is what `app.getName()`
# resolves to, which is what Electron calls the userData directory — so an
# existing install's settings, encrypted API keys, conversations, checkpoints
# and version history are all still under the old directory and are not read.
#
# That was worth doing before there was an audience and would not be after.
# Nothing migrates them: see the note in `services/resources.ts`.
appId: it.gamerover98.schematicaistudio
productName: Schematic AI Studio
copyright: Copyright © CyniaAI Team

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# prompts.json and block_id_list.txt stay outside the asar so users can edit
# them, and so `services/resources.ts`'s `process.resourcesPath` lookup finds
# them (see ARCHITECTURE.md §2 / resources.ts).
extraResources:
  - from: prompts.json
    to: prompts.json
  - from: block_id_list.txt
    to: block_id_list.txt
  # The default preview resource pack, plus `legacy_blocks.json` (the pre-1.13
  # id -> block-state table used to read MCEdit .schematic files).
  # `defaultResourcePackPath` scans this directory for the first .zip, so the
  # pack can be swapped or updated without touching code.
  - from: resources
    to: resources
  # The window icon, for `services/resources.ts`'s `appIconPath()`.
  #
  # `build/` is electron-builder's *buildResources* directory and is not in
  # `files`, so nothing under it exists at runtime -- the .ico embedded in the
  # .exe and the .icns in the .app are generated from `build/icon.png` at
  # package time and are not the same thing as a file the app can read. This
  # entry is what puts the window icon on Linux, where the running process has
  # to supply its own.
  - from: build/icon.png
    to: icon.png

# No asarUnpack list, and no native rebuild step: the sandbox is QuickJS
# compiled to WebAssembly, shipped by the "singlefile" variant that embeds the
# .wasm inside its JS module (RULEBOOK.md DEV-015). Every dependency left in
# this app is pure JS, so the same asar works on all three platforms.
asar: true

win:
  # Stated rather than left to the buildResources scan, and `build/icons/` is
  # why. With that directory present app-builder cuts the .ico from the *set*
  # and takes its largest member -- so the 1024px entry went in under a
  # directory record that says 256 (an .ico stores 256 as a literal 0 and has
  # no way to say more), and NSIS refused the installer outright with
  # "invalid icon file size". NSIS tops out at 256, and the icon set exists for
  # Linux, which wants every size it can get. One input each, then.
  #
  # `mac` and `linux` are deliberately left on the scan: an .icns holds 1024
  # and Apple asks for it, and the Linux set *is* that directory.
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No artifactName here, deliberately. Both targets emit a .exe, so one shared
  # name would send them to the same path in `release/` and the second would
  # overwrite the first -- silently, because nothing checks that an artifact it
  # is about to write is already there. Each target names its own file instead.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: SchematicAIStudio-${version}-setup-${arch}.${ext}

# The standalone .exe: unpacks to a temp directory and runs, installing nothing
# and writing no registry keys. The same app and the same userData -- a
# different way in, not a second copy.
#
# It inherits `win.icon` above, and that matters for the reason that line exists
# at all: a portable build is NsisTarget too, so an icon cut from `build/icons/`
# would fail it with the same "invalid icon file size".
portable:
  artifactName: SchematicAIStudio-${version}-portable-${arch}.${ext}

linux:
  category: Graphics
  target:
    - target: AppImage
      arch: [x64]
  # There is deliberately no `deb` and no `rpm`, and the absence is worth
  # stating because it reads as an oversight: fpm requires a maintainer, which
  # electron-builder takes from `package.json`'s `author` -- a plain string
  # with no email here, so `authorEmailIsMissed` is raised and the *whole*
  # Linux run dies rather than just that one target. An AppImage carries no
  # maintainer field, which is the only reason it is unaffected.
  #
  # Re-enabling is exactly two lines: the target back in this list, and
  # `maintainer: name <email>` under `linux:`.
  artifactName: SchematicAIStudio-${version}-${arch}.${ext}

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: SchematicAIStudio-${version}-${arch}.${ext}
