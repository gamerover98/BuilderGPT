<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      ARCHITECTURE.md §3 "Renderer CSP": the renderer reaches no network, ever.
      Every HTTP call in this app is made by the main process -- that is the
      entire reason for the Electron pivot (no CORS, no key in a browser
      context). If a future feature appears to need a host added here, the
      feature belongs in main.

      `connect-src 'none'` is now literal: the renderer opens no connection of
      any kind, not even to itself.

      It used to have to allow `blob:`. The viewer received a GLB with the
      texture atlas embedded as a PNG, and three.js decodes such an image
      through `ImageBitmapLoader`, which reads it with `fetch()` from a blob
      URL. That was safe — a blob URL names no host — but its failure mode was
      not: blocked, GLTFLoader logged a warning, carried on, and the model
      rendered untextured white while reporting success. There was no way to
      opt out, because GLTFLoader only consults `manager.getHandler()` for
      images carrying a `uri`, and ours lived in a bufferView.

      The atlas now crosses as raw RGBA pixels and becomes a `DataTexture`.
      Nothing decodes an image, so nothing fetches, so there is no silent
      failure left to guard against.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Schematic AI Studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
