<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      ARCHITECTURE.md §3 "Renderer CSP": the renderer reaches no network, ever.
      Every HTTP call in this app is made by the main process -- that is the
      entire reason for the Electron pivot (no CORS, no key in a browser
      context). If a future feature appears to need a host added here, the
      feature belongs in main.

      `connect-src blob:` is not an exception to that rule. A blob: URL is an
      in-memory object the page created itself; it names no host and permits no
      egress, so "the renderer makes no network calls" still holds exactly.

      It is required because three.js decodes the GLB's embedded PNG through
      `ImageBitmapLoader`, which reads the blob with `fetch()`. Under
      `connect-src 'none'` that fetch is blocked, GLTFLoader logs a warning and
      carries on, and the model renders as untextured white -- silently. There
      is no way to opt out of that loader for an image stored in a bufferView:
      GLTFLoader only consults `manager.getHandler()` for images with a `uri`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>BuilderGPT</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
